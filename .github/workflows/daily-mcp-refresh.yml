name: Daily MCP registry refresh

on:
  schedule:
    - cron: "0 4 * * *"          # 04:00 UTC every day
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "manual refresh"

permissions:
  contents: write

concurrency:
  group: mcp-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-mcp-${{ runner.os }}-${{ hashFiles('mcp-scrape/requirements.txt') }}
          restore-keys: |
            pip-mcp-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp-scrape/requirements.txt

      - name: Run incremental refresh
        run: |
          cd mcp-scrape
          python incremental_update.py | tee /tmp/refresh.log

      - name: Decide whether to commit
        id: decide
        run: |
          today=$(date -u +%Y-%m-%d)
          report="mcp-scrape/data/changes/${today}.md"
          # Skip when no daily report was produced
          if [ ! -f "$report" ]; then
            echo "commit=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Skip when all registries tripped the sanity gate (transient failure)
          if grep -q "tripped the rediscovery sanity gate" "$report"; then
            echo "commit=false" >> "$GITHUB_OUTPUT"
            echo "All registries tripped sanity gate; not committing."
            exit 0
          fi
          # Stage and check whether the listings/details JSONL actually changed
          git add mcp-scrape/data/
          if git diff --cached --quiet; then
            echo "commit=false" >> "$GITHUB_OUTPUT"
            echo "No data changes this run."
          else
            echo "commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.decide.outputs.commit == 'true'
        env:
          GIT_AUTHOR_NAME: "mcp-refresh-bot"
          GIT_AUTHOR_EMAIL: "actions@users.noreply.github.com"
          GIT_COMMITTER_NAME: "mcp-refresh-bot"
          GIT_COMMITTER_EMAIL: "actions@users.noreply.github.com"
        run: |
          today=$(date -u +%Y-%m-%d)
          report="mcp-scrape/data/changes/${today}.md"
          body=$(head -20 "$report" 2>/dev/null || echo "")
          git commit -m "chore(mcp-scrape): daily refresh ${today}" -m "$body"
          git push

      - name: Upload refresh log + daily report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-refresh-log-${{ github.run_id }}
          path: |
            /tmp/refresh.log
            mcp-scrape/data/changes/
          retention-days: 30
